<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — lost in space · KitFX</title>
<meta name="robots" content="noindex">
<script>
/* GitHub Pages project sites live under /<repo>/, so every asset here must be
   resolved against that prefix. This works for project and user sites alike. */
(function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = '/';
    if (/\.github\.io$/i.test(location.hostname) && parts.length) {
        base = '/' + parts[0] + '/';
    }
    document.write('<base href="' + base + '">');
})();
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<style>
    .lost {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 40px 24px;
        position: relative;
        z-index: 1;
    }
    .lost-inner { max-width: 620px; }
    .lost h1 {
        font-size: clamp(4rem, 16vw, 8rem);
        line-height: .9;
        margin: 0 0 8px;
        background: linear-gradient(100deg, #d8ccff, #8b5cf6 45%, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .lost h2 { font-size: clamp(1.3rem, 3vw, 1.8rem); margin: 0 0 14px; letter-spacing: -.02em; }
    .lost p { color: var(--muted); margin: 0 auto 26px; max-width: 30rem; }
    .lost .cta { justify-content: center; }
    .orbit { position: absolute; opacity: .45; pointer-events: none; }
    .orbit-a { width: 520px; height: 520px; }
    .orbit-b { width: 760px; height: 760px; }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula nebula-a" aria-hidden="true"></div>
<div class="nebula nebula-b" aria-hidden="true"></div>
<div class="orbit orbit-a" aria-hidden="true"></div>
<div class="orbit orbit-b" aria-hidden="true"></div>

<main class="lost">
    <div class="lost-inner">
        <p class="eyebrow"><span class="pulse"></span> Signal lost</p>
        <h1>404</h1>
        <h2>This page drifted out of orbit.</h2>
        <p>The link may be old, or the path may have a typo. The KitFX panel is still
           right where you left it.</p>
        <div class="cta">
            <a class="btn btn-primary" href="./">Back to KitFX</a>
            <a class="btn" href="assets/KitFX-1.0.0.zip" download>Download ZIP</a>
            <a class="btn btn-quiet" href="https://github.com/saberssr114" target="_blank" rel="noopener">GitHub</a>
        </div>
    </div>
</main>

<script src="js/site.js"></script>
</body>
</html>
